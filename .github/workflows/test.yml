name: Webテスト

on:
  push:
    branches: [develop, main]
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ゲームの自動テスト
        run: node --test tests/*.test.cjs
