name: Webゲーム自動テスト

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.cjs'
      - '.github/workflows/test.yml'
  push:
    branches: [develop]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.cjs'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ゲームロジックの回帰テスト
        run: node --test tests/*.test.cjs
      - name: CPU対戦シミュレーション（固定シード・各100試合）
        run: node scripts/balance-report.cjs --games 100 --seed 20261031
      - name: バランス候補7シナリオ比較（固定シード）
        run: node scripts/balance-scenarios.cjs --games 100 --seed 20261031
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: 縦横の実レンダリング・操作・CPU通し対戦
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
